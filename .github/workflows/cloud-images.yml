# Builds Orchester Cloud's two images, pushes them to GHCR, and redeploys the Portainer stack that runs them
# (deploy/cloud/PORTAINER.md). The images use GITHUB_TOKEN only; the deploy needs the PORTAINER_* secrets and is
# skipped, with a notice, while they are not set.
name: Cloud images

on:
  push:
    branches: [master]
    paths:
      # orchester-cloud and the workspace crates it is built from (`cargo tree -p orchester-cloud`).
      - crates/cloud/**
      - crates/api/**
      - crates/core/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - web/**
      - deploy/cloud/**
      - .dockerignore
      - .github/workflows/cloud-images.yml
  workflow_dispatch:

# One run at a time, so two deploys never overlap; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: cloud-images
  cancel-in-progress: false

permissions: {}

jobs:
  images:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: orchester-cloud
            context: .
            file: deploy/cloud/Dockerfile
          - image: orchester-cloud-web
            context: web
            file: web/Dockerfile.cloud
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `sha-<short>` for every build; `latest` only from master, so a manual run on another branch never replaces
      # what the stack pulls.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ivanzaida/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Secrets cannot be read in a job's `if`, so this job tells the deploy whether they are set. Only their names are
  # printed.
  deploy-settings:
    name: Deploy settings
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_TOKEN }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
        run: |
          missing=""
          [ -n "$PORTAINER_URL" ] || missing="$missing PORTAINER_URL"
          [ -n "$PORTAINER_TOKEN" ] || missing="$missing PORTAINER_TOKEN"
          [ -n "$PORTAINER_STACK_ID" ] || missing="$missing PORTAINER_STACK_ID"
          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Repository secrets not set:${missing}. The images were pushed; see deploy/cloud/PORTAINER.md."
            echo "Deploy skipped: repository secrets not set:${missing}. See deploy/cloud/PORTAINER.md." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Redeploy the Portainer stack
    needs: [images, deploy-settings]
    if: needs.deploy-settings.outputs.configured == 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Portainer CE's stack webhooks redeploy only Git-backed stacks, so the stack is updated through the API: the
      # same compose file and variables it has, with `pullImage` so the new images are pulled. The variables hold the
      # stack's secrets; they are masked first and never printed, and the token goes to curl in a file, not on its
      # command line.
      - name: Update the stack with its own file and variables, pulling the images
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_TOKEN }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
        run: |
          set -euo pipefail
          work="$(mktemp -d "$RUNNER_TEMP/portainer.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          umask 077
          printf 'header = "X-API-Key: %s"\n' "$PORTAINER_TOKEN" > "$work/curl.conf"
          api="${PORTAINER_URL%/}/api"

          # call METHOD PATH OUT [BODY]: writes the answer to OUT; on an error status prints only Portainer's message.
          call() {
            local status body=()
            [ -z "${4:-}" ] || body=(-H 'Content-Type: application/json' --data-binary "@$4")
            status="$(curl -sS --config "$work/curl.conf" --max-time 900 -X "$1" -o "$3" -w '%{http_code}' \
              "${body[@]}" "$api$2")"
            if [ "${status:0:1}" != "2" ]; then
              echo "::error::Portainer answered $status to $1 $2: $(jq -r '[.message, .details] | map(select(. != null)) | join(": ")' "$3" 2>/dev/null || echo 'no readable message')"
              exit 1
            fi
          }

          call GET "/stacks/$PORTAINER_STACK_ID" "$work/stack.json"
          jq -r '.Env // [] | .[].value | select(. != "")' "$work/stack.json" | while IFS= read -r value; do
            echo "::add-mask::$value"
          done
          # Type 2 is a standalone compose stack. A Git-backed stack would be detached from its repository by this
          # update, so it is refused instead.
          jq -e '.Type == 2 and .GitConfig == null' "$work/stack.json" > /dev/null || {
            echo "::error::Stack $PORTAINER_STACK_ID is not a plain (non-Git) compose stack; see deploy/cloud/PORTAINER.md."
            exit 1
          }
          endpoint="$(jq -r '.EndpointId' "$work/stack.json")"
          name="$(jq -r '.Name' "$work/stack.json")"

          call GET "/stacks/$PORTAINER_STACK_ID/file" "$work/file.json"
          jq -n --slurpfile stack "$work/stack.json" --slurpfile file "$work/file.json" \
            '{stackFileContent: $file[0].StackFileContent, env: ($stack[0].Env // []), pullImage: true}' > "$work/update.json"

          echo "Redeploying stack $name (environment $endpoint); latest is now sha-${GITHUB_SHA::7}"
          call PUT "/stacks/$PORTAINER_STACK_ID?endpointId=$endpoint" "$work/updated.json" "$work/update.json"
          echo "Stack $name redeployed." | tee -a "$GITHUB_STEP_SUMMARY"

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  windows:
    name: Windows (check.ps1 + tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the stable toolchain; rustfmt.toml needs nightly options.
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Quality gate
        shell: pwsh
        run: ./tools/check.ps1
      - name: Tests
        run: cargo test --workspace

  macos:
    name: macOS (clippy + tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # As tools/check.ps1: actix-web (orchester-cloud) turns on tracing's `log` feature, which in one build with
      # the other crates raises clippy's cognitive complexity of their tracing calls; each side is checked apart.
      - name: Clippy
        run: cargo clippy --workspace --exclude orchester-cloud --all-targets --all-features -- -D warnings
      - name: Clippy (orchester-cloud)
        run: cargo clippy -p orchester-cloud --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace

  # orchester-cloud's tests need PostgreSQL; in the jobs above they run nothing unless named.
  cloud:
    name: Linux (Orchester Cloud on PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ORCHESTER_CLOUD_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (orchester-cloud)
        run: cargo clippy -p orchester-cloud --all-targets --all-features -- -D warnings
      - name: Cloud tests
        run: cargo test -p orchester-cloud --test cloud ::
      - name: Identity and limiter tests
        run: |
          cargo test -p orchester-api --features identity --test identity identity
          cargo test -p orchester-cloud --test limits limits

name: CI

# On a push to master that raises the version (a release), and by hand (Actions → CI → Run workflow); other pushes
# and pull requests start nothing, so CI minutes go to releases.
on:
  push:
    branches: [master]
    paths: [crates/desktop-app/Cargo.toml]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The other jobs run only when this push raised the app's version (crates/desktop-app/Cargo.toml), or when run by hand.
  version:
    name: Version raised?
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: compare
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          version() { sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"/\1/p'; }
          now="$(version < crates/desktop-app/Cargo.toml)"
          if [ "$EVENT" != push ] || [ -z "${BEFORE//0/}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet --depth=1 origin "$BEFORE"
          was="$(git show "$BEFORE:crates/desktop-app/Cargo.toml" | version)"
          echo "Version $was -> $now"
          if [ "$was" != "$now" ]; then echo "changed=true"; else echo "changed=false"; fi >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    if: needs.version.outputs.changed == 'true'
    name: Windows (check.ps1 + tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the stable toolchain; rustfmt.toml needs nightly options.
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Quality gate
        shell: pwsh
        run: ./tools/check.ps1
      - name: Tests
        run: cargo test --workspace

  macos:
    needs: version
    if: needs.version.outputs.changed == 'true'
    name: macOS (clippy + tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace

  # orchester-api's identity tokens and key sets, which the desktop app checks and Orchester Cloud (its private
  # repository) signs; the feature is off in the jobs above.
  identity:
    needs: version
    if: needs.version.outputs.changed == 'true'
    name: Linux (orchester-api identity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Identity tests
        run: cargo test -p orchester-api --features identity --test identity identity

[package]
name = "orchester-store"
description = "Local SQLite persistence for Orchester: the project store in <repo>/.orchester and the application database."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
orchester-core.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zstd.workspace = true

[features]
# `ProjectDb::create_at_version` for the store's own migration tests, which enable it below: a project
# database at an older schema version, for a test to fill with the rows that version wrote.
test-support = []

[dev-dependencies]
orchester-store = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
rusqlite.workspace = true

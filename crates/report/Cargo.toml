[package]
name = "orchester-report"
description = "Orchester's error reports in the Sentry protocol: the scrubber every report of the desktop app and the runner passes through."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The client options the app and the runner report with (`client`): the panic hook, the stack trace and the OS and
# CPU contexts. Without a transport: each program that sends turns on its own.
client = ["sentry/backtrace", "sentry/contexts", "sentry/panic"]

[dependencies]
sentry.workspace = true

[package]
name = "orchester-runner"
description = "Orchester runner process: serves one project's IPC pipe, supervises agent processes and manages run worktrees."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "orchester-runner"
path = "src/main.rs"

# A stand-in for the Codex CLI that replays recorded output, for the execution tests. Built only
# with the `test-agent` feature, so it never ships next to the runner.
[[bin]]
name = "orchester-fake-codex"
path = "tests/support/fake_codex.rs"
required-features = ["test-agent"]

# The same for the Claude Code CLI.
[[bin]]
name = "orchester-fake-claude"
path = "tests/support/fake_claude.rs"
required-features = ["test-agent"]

# A harmless program for the command tool tests (prints, writes a file, sleeps, exits with a code).
[[bin]]
name = "orchester-test-command"
path = "tests/support/test_command.rs"
required-features = ["test-agent"]

[[test]]
name = "execution"
required-features = ["test-agent"]

[[test]]
name = "tools"
required-features = ["test-agent"]

[[test]]
name = "control"
required-features = ["test-agent"]

[[test]]
name = "lifecycle"
required-features = ["test-agent"]

[[test]]
name = "graph"
required-features = ["test-agent"]

[[test]]
name = "step_budget"
required-features = ["test-agent"]

[[test]]
name = "run_permissions"
required-features = ["test-agent"]

[[test]]
name = "claude"
required-features = ["test-agent"]

[[test]]
name = "settling"
required-features = ["test-agent"]

[[test]]
name = "plan_settling"
required-features = ["test-agent"]

[[test]]
name = "request_serialization"
required-features = ["test-agent"]

[[test]]
name = "instructions"
required-features = ["test-agent"]

[[test]]
name = "environment"
required-features = ["test-agent"]

[[test]]
name = "plans"
required-features = ["test-agent"]

[[test]]
name = "conversation"
required-features = ["test-agent"]

[[test]]
name = "unreadable"
required-features = ["test-agent"]

[[test]]
name = "mcp"
required-features = ["test-agent"]

[features]
test-agent = []

[dependencies]
orchester-core.workspace = true
orchester-exec.workspace = true
orchester-ipc.workspace = true
orchester-store.workspace = true
# Reads the values of the secrets MCP servers use from the OS keychain when an agent starts.
orchester-vault.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The in-memory keychain of the tests is shared with the scheduler.
parking_lot.workspace = true
# Reads the MCP configuration file the fake Claude Code CLI reports.
serde_json.workspace = true
# Damages a run's row the way an edit outside Orchester would; the store has no API for that.
rusqlite.workspace = true
tempfile.workspace = true
tokio.workspace = true

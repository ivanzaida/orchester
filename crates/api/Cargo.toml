[package]
name = "orchester-api"
description = "Orchester shared-server JSON contract."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The HTTP client the desktop talks to a server with (`client` module).
client = ["dep:parking_lot", "dep:reqwest", "dep:rustls", "dep:rustls-platform-verifier"]
# Tests that serve a certificate from a test authority trust it besides the operating system's store
# (`client::trust_for_tests`); a stand-in cloud on loopback and the tests' cloud key (`test_support`), which the
# desktop's tests here and the end-to-end tests of the private platform repository share.
test-support = ["client", "identity"]
# Orchester Cloud's identity tokens and signed key sets (`identity` module): signing for the cloud, verifying for team
# servers.
identity = ["dep:base64", "dep:ring"]
# The check of a release file's Ed25519 signature against the accepted release keys (`releases::AcceptedReleaseKeys`):
# for the app before it runs an update, and for the cloud when CI finalizes an upload.
release-signature = ["dep:ring"]
# Signing a release file with a release key's private half (`releases::ReleaseSigningKey`), for CI's release tool
# (`orchester-release`).
release-signing = ["release-signature"]

[dependencies]
orchester-core.workspace = true
base64 = { workspace = true, optional = true }
# A module's start and target days (`modules.rs`), as core's `ModuleDetails` keeps them; already built for core.
chrono.workspace = true
# The client's record of the certificate its connections present (`client/recorded.rs`); already built.
parking_lot = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
# The operating system's trust store, as reqwest uses it, wrapped to record the verified leaf (`client/recorded.rs`).
rustls-platform-verifier = { workspace = true, optional = true }
serde.workspace = true
# A shared resource version's body (`resources.rs`), core's stored JSON of its kind; already built for core.
serde_json.workspace = true
# A team server's certificate pin and check code: the SHA-256 of its certificate.
sha2.workspace = true
# The SSE parser's error (`sse.rs`), besides the client's and the identity module's.
thiserror.workspace = true
# Passwords permit whitespace-only values; core's project SecretValue rejects them.
# Wipe this JSON-boundary credential's memory on drop using the existing workspace dependency.
zeroize.workspace = true

[dev-dependencies]
# The client's tests against a recording listener on loopback (`tests/cloud_address.rs`).
tokio.workspace = true

[[test]]
name = "identity"
required-features = ["identity"]

[[test]]
name = "invites_accept"
required-features = ["identity"]

[[test]]
name = "totp"
required-features = ["identity"]

[[test]]
name = "cloud_address"
required-features = ["client"]

[[test]]
name = "events_client"
required-features = ["client"]

[[test]]
name = "releases"
required-features = ["client", "release-signature"]

[package]
name = "orchester-api"
description = "Orchester shared-server JSON contract."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The HTTP client the desktop talks to a server with (`client` module).
client = ["dep:parking_lot", "dep:reqwest", "dep:rustls", "dep:rustls-platform-verifier", "dep:serde_json", "dep:thiserror"]
# Tests that serve a certificate from a test authority trust it besides the operating system's store
# (`client::trust_for_tests`).
test-support = ["client"]
# Orchester Cloud's identity tokens and signed key sets (`identity` module): signing for the cloud, verifying for team
# servers.
identity = ["dep:base64", "dep:ring", "dep:serde_json", "dep:thiserror"]

[dependencies]
orchester-core.workspace = true
base64 = { workspace = true, optional = true }
# A module's start and target days (`modules.rs`), as core's `ModuleDetails` keeps them; already built for core.
chrono.workspace = true
# The client's record of the certificate its connections present (`client/recorded.rs`); already built.
parking_lot = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
# The operating system's trust store, as reqwest uses it, wrapped to record the verified leaf (`client/recorded.rs`).
rustls-platform-verifier = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
# A team server's certificate pin and check code: the SHA-256 of its certificate.
sha2.workspace = true
thiserror = { workspace = true, optional = true }
# Passwords permit whitespace-only values; core's project SecretValue rejects them.
# Wipe this JSON-boundary credential's memory on drop using the existing workspace dependency.
zeroize.workspace = true

[dev-dependencies]
# The client's tests start a real server on loopback with a temporary data directory.
orchester-server.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[[test]]
name = "identity"
required-features = ["identity"]

[[test]]
name = "totp"
required-features = ["identity"]

[[test]]
name = "client"
required-features = ["client"]

[[test]]
name = "client_redaction"
required-features = ["client"]

[[test]]
name = "client_proxy"
required-features = ["client"]

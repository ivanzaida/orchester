[package]
name = "orchester-core"
description = "Orchester domain model, independent of UI and transport."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Where the local day starts, for the daily project budget; std has no local time.
chrono.workspace = true
serde.workspace = true
# Reads the JSON the agent CLIs print (model catalog, sign-in status).
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
# Whether a drive letter is a network share (`GetDriveTypeW`), so a path on one is never resolved: std cannot tell.
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
# The in-memory secret store and keychain of the secret tests are shared across threads.
parking_lot.workspace = true
# Temporary git repositories for reading changes with the real git.
tempfile.workspace = true

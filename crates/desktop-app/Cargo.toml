[package]
name = "orchester-app"
description = "Orchester desktop app, in the orchester2 design; replaces orchester-desktop."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "orchester-app"

[[bin]]
name = "orchester-app"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
# In-app DevTools, opened as a secondary window at startup.
devtools = ["lurq/devtools"]

[dependencies]
# The routing and bearer/Origin guard of the app's MCP server (`mcp::server`, `mcp::guard`), on loopback.
axum.workspace = true
# The MCP server serves each connection with a header deadline and a connection cap, which axum::serve
# cannot set; both are already built through lurq and axum.
hyper.workspace = true
hyper-util.workspace = true
# Decodes the bundled PNG of the window icon.
image.workspace = true
# The theme setting, and the commands that read the system appearance.
orchester-core.workspace = true
# Runs the program that reads the system appearance with a hidden console (`appearance::system`), the
# programs of git work (`Programs`), and opens folders and files with their default program.
orchester-exec.workspace = true
# The daily log file (`app_log`), shared with the deprecated desktop, and how a session ended.
orchester-ipc.workspace = true
# Where the apps keep their data and logs, and the application database (`orchester.db`) that holds the
# app's settings.
orchester-store.workspace = true
# The application layer the deprecated desktop shares: the session, projects, runners, activity and
# project data. Its DevTools markers, because its types are component props and signal values here.
orchester-workspace = { workspace = true, features = ["devtools-inspect"] }
lurq = { workspace = true, features = [
  "winit",
  "wgpu",
  "router",
  "form",
  "i18n",
  # `I18n::add_json` for the bundled locale files.
  "serde",
  # The app's MCP server: lurq's window tools and the app's own (`mcp`), in every build.
  "mcp",
  # Futures and streams of screens run on the app's runtime, off the UI thread.
  "tokio",
  # Agent-written Markdown in the conversation and plans.
  "markdown",
  # Copy (a path, a command) and copying from text inputs.
  "clipboard",
] }
parking_lot.workspace = true
# Arguments and results of the app's MCP tools.
serde_json.workspace = true
thiserror.workspace = true
# The runtime of the app's MCP server.
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The bearer token of the app's MCP server, from the OS random source.
uuid.workspace = true

# Brings the window of the app that has the data folder open to the front (`startup::front`).
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# Only Windows programs embed their icon; see build.rs.
[target.'cfg(windows)'.build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
# The QA seed (`examples/seed`) damages a run's record and sets a project database's schema version the way an
# edit outside Orchester or a newer build would; the store has no API for either.
rusqlite.workspace = true
tempfile.workspace = true

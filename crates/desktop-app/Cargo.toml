[package]
# The package keeps its name, which `cargo -p`, the tests' commands and the projects' pipelines use; its program is
# `orchester` (`orchester.exe`).
name = "orchester-app"
description = "Orchester desktop app, in the orchester2 design."
# The app's own version, apart from the workspace's (which the team server reports): bumping it on master releases
# the app (.github/workflows/app-release.yml, docs/stable-build.md "Releases from CI").
version = "0.3.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "orchester"

[[bin]]
name = "orchester"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
# In-app DevTools, opened as a secondary window at startup.
devtools = ["lurq/devtools"]
# lurq's frame timing: profile sessions over the MCP server (`lurq_profile_start`) and in headless tests
# (`tests/orchestrator/open_long.rs`).
perf_profile = ["lurq/perf_profile"]
# The window headless on a data folder of its own, signed in to a stand-in cloud (`test_support`), for the tests and QA
# examples here and the end-to-end tests of the private platform repository, which build this crate by git. Never in
# the app's program.
test-support = ["dep:tempfile", "orchester-api/test-support"]

[dependencies]
# The Usage page's days (`orchester_core::usage::DayRange`) read as month, day and weekday; already built
# for core and the workspace.
chrono.workspace = true
# The routing and bearer/Origin guard of the app's MCP server (`mcp::server`, `mcp::guard`), on loopback.
axum.workspace = true
# The MCP server serves each connection with a header deadline and a connection cap, which axum::serve
# cannot set; both are already built through lurq and axum.
hyper.workspace = true
hyper-util.workspace = true
# Decodes the bundled PNG of the window icon.
image.workspace = true
# The theme setting, and the commands that read the system appearance.
orchester-core.workspace = true
# Runs the program that reads the system appearance with a hidden console (`appearance::system`), the
# programs of git work (`Programs`), and opens folders and files with their default program.
orchester-exec.workspace = true
# The daily log file (`app_log`), shared with the deprecated desktop, and how a session ended.
orchester-ipc.workspace = true
# The scrubber every error report passes through before it leaves (`error_reports`, `docs/error-reports.md`).
orchester-report.workspace = true
# Where the apps keep their data and logs, and the application database (`orchester.db`) that holds the
# app's settings.
orchester-store.workspace = true
# The wire types Settings › Orchester shows (invites, a server's answer, the cloud's and servers' refusals), as
# `orchester-workspace` hands them over; the client feature for the server addresses and client errors it carries.
orchester-api = { workspace = true, features = ["client"] }
# The application layer the deprecated desktop shares: the session, projects, runners, activity and
# project data. Its DevTools markers, because its types are component props and signal values here.
orchester-workspace = { workspace = true, features = ["devtools-inspect"] }
lurq = { workspace = true, features = [
  "winit",
  "wgpu",
  # The dashed add-step slot from v1nZD.
  "svg",
  "router",
  "form",
  "i18n",
  # `I18n::add_json` for the bundled locale files.
  "serde",
  # Text agents and people write, read as Markdown (`ui::markdown`).
  "markdown",
  # Copy beside a command or another long value (`ui::code_box`); a pasted screenshot as PNG (`ui::attachments`).
  "clipboard",
  # Thumbnails of the images attached to a message, decoded off the UI thread (`ui::attachments`); its decoders are
  # already built for lurq's screenshots.
  "image",
  # The app's MCP server: lurq's window tools and the app's own (`mcp`), in every build.
  "mcp",
  # Futures and streams of screens run on the app's runtime, off the UI thread.
  "tokio",
  # The Usage page's charts; tiny-skia and lyon are already built for `svg`, so it adds no crate.
  "canvas",
] }
parking_lot.workspace = true
# Where an agent's chat message has text outside code and links, by offset, for the places it names
# (`ui::chat::references`); already built through lurq's `markdown`.
pulldown-cmark.workspace = true
# The system's folder picker for the project switcher's Open folder…; lurq already builds it for DevTools.
rfd.workspace = true
# The ring crypto provider that the error reports' reqwest client takes (`error_reports`), as orchester-api's does;
# already built through reqwest.
rustls.workspace = true
# Sends the app's panics and ERROR log lines to GlitchTip (`error_reports`, `app_log`): the panic hook, the tracing
# layer, the stack trace, the OS and CPU contexts and the HTTP transport over reqwest and rustls, which orchester-api's
# client already builds. A Sentry client with its queue, rate limits and envelopes is not a few lines of code.
# `debug-images` lists the loaded modules with their debug IDs, so GlitchTip matches a report's raw frames to the
# uploaded PDBs. Without sessions, logs or metrics.
sentry = { workspace = true, features = [
  "backtrace",
  "contexts",
  "debug-images",
  "panic",
  "reqwest",
  "rustls-no-provider",
  "tracing",
] }
# Arguments and results of the app's MCP tools.
serde_json.workspace = true
# The data folder of a test's window (`test_support`, feature `test-support` only).
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
# The runtime of the app's MCP server.
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The host a chat shows beside a link to the web (`ui::chat::links`).
url.workspace = true
# The bearer token of the app's MCP server, from the OS random source.
uuid.workspace = true
# Wipes unsaved credential input when its inspector closes.
zeroize.workspace = true

# Gives lurq's window class and the window the executable's embedded icon (`system_icon`): neither lurq
# nor winit loads icon resources or sets class icons. Brings the window of the app that has the data folder
# open to the front (`startup::front`). Holds the MCP server's port so no other socket can share it
# (SO_EXCLUSIVEADDRUSE, `mcp::bind`), on a socket2 socket set up before it binds.
[target.'cfg(windows)'.dependencies]
socket2.workspace = true
# Toasts with the app's AppUserModelID and the taskbar's overlay badge (`notifications::os::windows`).
windows.workspace = true
windows-sys = { workspace = true, features = [
  "Win32_Networking_WinSock",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

# UserNotifications and the Dock's badge (`notifications::os::macos`).
[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true

# Only Windows programs embed their icon; see build.rs.
[target.'cfg(windows)'.build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
# The tests' and QA examples' window and stand-in cloud (`test_support`).
orchester-app = { workspace = true, features = ["test-support"] }
# Counts a runner's reports in tests of what follows them, which run no runner.
orchester-workspace = { workspace = true, features = ["devtools-inspect", "test-support"] }
orchester-api = { workspace = true, features = ["client", "identity"] }
# Exercises the production MCP tools over an in-process transport without discovery-file ACLs.
rmcp = { workspace = true, features = ["client"] }
# The QA seed (`examples/seed`) damages a run's record and sets a project database's schema version the way an
# edit outside Orchester or a newer build would; the store has no API for either.
rusqlite.workspace = true
# Sentry's test transport, which keeps a test's error reports instead of sending them (`tests/error_reports.rs`).
sentry = { workspace = true, features = ["test"] }
# Tries to share the MCP server's port the way another program would (`tests/mcp_stable`).
socket2.workspace = true
tempfile.workspace = true

# Reads the running app's window and class icons (`tests/system_icon.rs`).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

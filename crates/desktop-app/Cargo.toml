[package]
name = "orchester-app"
description = "Orchester desktop app, in the orchester2 design; replaces orchester-desktop."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "orchester-app"

[[bin]]
name = "orchester-app"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
# In-app DevTools, opened as a secondary window at startup.
devtools = ["lurq/devtools"]

[dependencies]
# The routing and bearer/Origin guard of the app's MCP server (`mcp::server`, `mcp::guard`), on loopback.
axum.workspace = true
# The MCP server serves each connection with a header deadline and a connection cap, which axum::serve
# cannot set; both are already built through lurq and axum.
hyper.workspace = true
hyper-util.workspace = true
# Decodes the bundled PNG of the window icon.
image.workspace = true
# The theme setting, and the commands that read the system appearance.
orchester-core.workspace = true
# Runs the program that reads the system appearance with a hidden console (`appearance::system`).
orchester-exec.workspace = true
# The daily log file (`app_log`), shared with the deprecated desktop.
orchester-ipc.workspace = true
# Where the apps keep their data and logs, and the application database (`orchester.db`) that holds the
# app's settings.
orchester-store.workspace = true
lurq = { workspace = true, features = [
  "winit",
  "wgpu",
  "router",
  "form",
  "i18n",
  # `I18n::add_json` for the bundled locale files.
  "serde",
  # The app's MCP server: lurq's window tools and the app's own (`mcp`), in every build.
  "mcp",
] }
parking_lot.workspace = true
# Arguments and results of the app's MCP tools.
serde_json.workspace = true
thiserror.workspace = true
# The runtime of the app's MCP server.
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The bearer token of the app's MCP server, from the OS random source.
uuid.workspace = true

# Gives lurq's window class and the window the executable's embedded icon (`system_icon`): neither lurq
# nor winit loads icon resources or sets class icons.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

# Only Windows programs embed their icon; see build.rs.
[target.'cfg(windows)'.build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Reads the running app's window and class icons (`tests/system_icon.rs`).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[package]
name = "orchester-app"
description = "Orchester desktop app, in the orchester2 design; replaces orchester-desktop."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "orchester-app"

[[bin]]
name = "orchester-app"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
# In-app DevTools, opened as a secondary window at startup.
devtools = ["lurq/devtools"]

[dependencies]
# The routing and bearer/Origin guard of the app's MCP server (`mcp::server`, `mcp::guard`), on loopback.
axum.workspace = true
# The MCP server serves each connection with a header deadline and a connection cap, which axum::serve
# cannot set; both are already built through lurq and axum.
hyper.workspace = true
hyper-util.workspace = true
# Decodes the bundled PNG of the window icon.
image.workspace = true
# The theme setting, and the commands that read the system appearance.
orchester-core.workspace = true
# Runs the program that reads the system appearance with a hidden console (`appearance::system`), the
# programs of git work (`Programs`), and opens folders and files with their default program.
orchester-exec.workspace = true
# The daily log file (`app_log`), shared with the deprecated desktop, and how a session ended.
orchester-ipc.workspace = true
# Where the apps keep their data and logs, and the application database (`orchester.db`) that holds the
# app's settings.
orchester-store.workspace = true
# The wire types Settings › Orchester shows (invites, a server's answer, the cloud's and servers' refusals), as
# `orchester-workspace` hands them over; the client feature for the server addresses and client errors it carries.
orchester-api = { workspace = true, features = ["client"] }
# The application layer the deprecated desktop shares: the session, projects, runners, activity and
# project data. Its DevTools markers, because its types are component props and signal values here.
orchester-workspace = { workspace = true, features = ["devtools-inspect"] }
lurq = { workspace = true, features = [
  "winit",
  "wgpu",
  # The dashed add-step slot from v1nZD.
  "svg",
  "router",
  "form",
  "i18n",
  # `I18n::add_json` for the bundled locale files.
  "serde",
  # Text agents and people write, read as Markdown (`ui::markdown`).
  "markdown",
  # Copy beside a command or another long value (`ui::code_box`).
  "clipboard",
  # The app's MCP server: lurq's window tools and the app's own (`mcp`), in every build.
  "mcp",
  # Futures and streams of screens run on the app's runtime, off the UI thread.
  "tokio",
] }
parking_lot.workspace = true
# The system's folder picker for the project switcher's Open folder…; lurq already builds it for DevTools.
rfd.workspace = true
# Arguments and results of the app's MCP tools.
serde_json.workspace = true
thiserror.workspace = true
# The runtime of the app's MCP server.
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The bearer token of the app's MCP server, from the OS random source.
uuid.workspace = true
# Wipes unsaved credential input when its inspector closes.
zeroize.workspace = true

# Gives lurq's window class and the window the executable's embedded icon (`system_icon`): neither lurq
# nor winit loads icon resources or sets class icons. Brings the window of the app that has the data folder
# open to the front (`startup::front`). Holds the MCP server's port so no other socket can share it
# (SO_EXCLUSIVEADDRUSE, `mcp::bind`), on a socket2 socket set up before it binds.
[target.'cfg(windows)'.dependencies]
socket2.workspace = true
windows-sys = { workspace = true, features = [
  "Win32_Networking_WinSock",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

# Only Windows programs embed their icon; see build.rs.
[target.'cfg(windows)'.build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
# A real team server on loopback for the tests and the QA backends of Settings › Orchester and Sharing
# (`tests/orchester`, `examples/n1_backends`), with the cloud's identity keys their stand-in cloud signs with.
orchester-server.workspace = true
orchester-api = { workspace = true, features = ["client", "identity"] }
# Exercises the production MCP tools over an in-process transport without discovery-file ACLs.
rmcp = { workspace = true, features = ["client"] }
# The QA seed (`examples/seed`) damages a run's record and sets a project database's schema version the way an
# edit outside Orchester or a newer build would; the store has no API for either.
rusqlite.workspace = true
# Tries to share the MCP server's port the way another program would (`tests/mcp_stable`).
socket2.workspace = true
tempfile.workspace = true

# Reads the running app's window and class icons (`tests/system_icon.rs`).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

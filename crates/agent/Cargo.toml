[package]
name = "orchester-agent"
description = "Orchester's native agent: model API clients over HTTP and SSE, and the file and search tool executors."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The model clients over HTTP and SSE. Without it the crate is the file and search tool executors only,
# which the runner serves to every agent CLI.
default = ["http"]
http = ["dep:reqwest", "dep:rustls", "dep:serde", "dep:serde_json", "dep:tokio"]

[dependencies]
orchester-core.workspace = true
# Starts ripgrep for `list_files` and `search` the way Orchester starts every program (no console
# window, a process group of its own on macOS, the full search path).
orchester-exec.workspace = true
# The model clients' memory of what a model supports and of conversations sent without thinking
# blocks, shared by concurrent requests; and the file tools' read stamps.
parking_lot.workspace = true
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# The content hash of a read stamp (§4.1).
sha2.workspace = true
# The atomic write of `edit_file` and `write_file`: a temporary file in the target's folder, renamed
# over it (§4.4).
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }

# `delete_file` and `move_file` change the entry they checked through folders opened without following links
# (`openat`, `unlinkat`, `renameat` with no-replace); std has no calls relative to an open folder.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

# `delete_file` and `move_file` delete and rename through a handle opened without following a link and checked with
# `GetFinalPathNameByHandleW`; std deletes and renames by path only.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
# The fake model server's state, shared by its connections.
parking_lot.workspace = true
# The fake model server's scripted turns and the temporary worktrees of the file tool tests.
tempfile.workspace = true
tokio.workspace = true

[package]
name = "orchester-server"
description = "Self-hosted Orchester shared-project server."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The design's face, inside the page the server answers without its admin app (`http::admin_unavailable`).
base64.workspace = true
# `client`: with `proxy_certificate = "auto"` the server reads its proxy's certificate at its own public address, as an
# app does, through the API client's trust-store verifier that records the verified leaf (`presented::auto`).
orchester-api = { workspace = true, features = ["client", "identity"] }
orchester-core.workspace = true
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
parking_lot.workspace = true
rcgen.workspace = true
ring.workspace = true
rusqlite = { workspace = true, features = ["backup"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# `trust_for_tests`: the `auto` tests' proxy presents certificates from a test authority.
orchester-api = { workspace = true, features = ["client", "identity", "test-support"] }
tempfile.workspace = true

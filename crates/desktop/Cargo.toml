[package]
name = "orchester-desktop"
description = "Orchester desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "orchester"

[[bin]]
name = "orchester"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
# In-app DevTools, opened as a secondary window at startup.
devtools = ["lurq/devtools"]
perf_profile = ["lurq/perf_profile"]

[dependencies]
# The HTTP routing and bearer check of Orchester's own MCP server (`app_mcp`), on loopback.
axum.workspace = true
chrono.workspace = true
image.workspace = true
orchester-core.workspace = true
# Shared servers: the HTTP client of the server's API (`sharing`).
orchester-api = { workspace = true, features = ["client"] }
lurq = { workspace = true, features = [
  "winit",
  "wgpu",
  "router",
  "form",
  "i18n",
  "serde",
  "query",
  "persistent_storage",
  "svg",
  "markdown",
  "clipboard",
  "tokio",
  # The embedded MCP server, in every build: agents drive and inspect the running app through it
  # (loopback only, bearer token from a per-user discovery file; see `embedded_mcp`).
  "mcp",
] }
orchester-exec.workspace = true
# Removes the codebase indexes of run worktrees it removes.
orchester-index.workspace = true
orchester-ipc.workspace = true
orchester-store.workspace = true
orchester-vault.workspace = true
parking_lot.workspace = true
rfd.workspace = true
# Orchester's own MCP server (`app_mcp`): automation controls tasks, runs and approvals through it.
rmcp.workspace = true
# Checks that an MCP call's arguments are JSON, without building them, before the approval dialog
# lays them out for reading.
serde.workspace = true
serde_json.workspace = true
syntect.workspace = true
thiserror.workspace = true
# Reads the repository's discovery file `orchester.toml` (docs/architecture/server.md, decision 11);
# already built for the server's configuration, so it adds no crate.
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The bearer token of Orchester's MCP server, from the OS random source (`app_mcp`).
uuid.workspace = true
# Wipes a secret value typed but not saved.
zeroize.workspace = true

# The computer's name a shared server lists this computer's session under (`sharing::device`).
[target.'cfg(target_os = "macos")'.dependencies]
rustix.workspace = true

# Only Windows programs embed their icon; see build.rs.
[target.'cfg(windows)'.build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
# Damages a run's row the way an edit outside Orchester would; the store has no API for that.
rusqlite.workspace = true
tempfile.workspace = true
# Shared-server tests talk to a real server on loopback with a temporary data directory.
orchester-server.workspace = true

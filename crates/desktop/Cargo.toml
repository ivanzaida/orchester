[package]
name = "orchester-desktop"
description = "Orchester desktop app. Deprecated: replaced by orchester-app (crates/desktop-app)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "orchester"

[[bin]]
name = "orchester"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
# In-app DevTools, opened as a secondary window at startup.
devtools = ["lurq_legacy/devtools"]
perf_profile = ["lurq_legacy/perf_profile"]

[dependencies]
# The HTTP routing and bearer check of Orchester's own MCP server (`app_mcp`), on loopback.
axum.workspace = true
chrono.workspace = true
# Orchester's MCP server serves each connection with header and idle deadlines and a connection cap
# (`app_mcp::server`), which axum::serve cannot set; both are already built through lurq and axum.
hyper.workspace = true
hyper-util.workspace = true
image.workspace = true
orchester-core.workspace = true
# Shared servers: the HTTP client of the server's API (`sharing`).
orchester-api = { workspace = true, features = ["client"] }
lurq_legacy = { workspace = true, features = [
  "winit",
  "wgpu",
  "router",
  "form",
  "i18n",
  "serde",
  "query",
  "persistent_storage",
  "svg",
  "markdown",
  "clipboard",
  "tokio",
  # The Usage dashboard's charts; tiny-skia and lyon are already built for `svg`, so it adds no crate.
  "canvas",
  # The embedded MCP server, in every build: agents drive and inspect the running app through it
  # (loopback only, bearer token from a per-user discovery file; see `embedded_mcp`).
  "mcp",
] }
orchester-exec.workspace = true
# The code index settings show what each index holds and how its build goes.
orchester-index.workspace = true
orchester-ipc.workspace = true
orchester-store.workspace = true
# The application layer under the screens; the markers lurq needs of its types come with
# `devtools-inspect-legacy`.
orchester-workspace = { workspace = true, features = ["devtools-inspect-legacy"] }
parking_lot.workspace = true
rfd.workspace = true
# Orchester's own MCP server (`app_mcp`): automation controls tasks, runs and approvals through it,
# over its streamable HTTP transport.
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
# Checks that an MCP call's arguments are JSON, without building them, before the approval dialog
# lays them out for reading.
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The bearer token of Orchester's MCP server, from the OS random source (`app_mcp`).
uuid.workspace = true
# Wipes a secret value typed but not saved.
zeroize.workspace = true

# Only Windows programs embed their icon; see build.rs.
[target.'cfg(windows)'.build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
# Damages a run's row the way an edit outside Orchester would; the store has no API for that.
rusqlite.workspace = true
tempfile.workspace = true
# Shared-server tests talk to a real server on loopback with a temporary data directory.
orchester-server.workspace = true

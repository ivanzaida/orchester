[package]
name = "orchester-desktop"
description = "Orchester desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "orchester"

[[bin]]
name = "orchester"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
# In-app DevTools, opened as a secondary window at startup.
devtools = ["lurq/devtools"]
# Embedded MCP server so agents can drive and inspect the running app.
mcp = ["lurq/mcp"]
perf_profile = ["lurq/perf_profile"]

[dependencies]
chrono.workspace = true
orchester-core.workspace = true
lurq = { workspace = true, features = [
  "winit",
  "wgpu",
  "router",
  "form",
  "i18n",
  "serde",
  "query",
  "persistent_storage",
  "svg",
  "markdown",
  "clipboard",
  "tokio",
] }
orchester-exec.workspace = true
orchester-ipc.workspace = true
orchester-store.workspace = true
orchester-vault.workspace = true
parking_lot.workspace = true
rfd.workspace = true
syntect.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Wipes a secret value typed but not saved.
zeroize.workspace = true

[dev-dependencies]
# Damages a run's row the way an edit outside Orchester would; the store has no API for that.
rusqlite.workspace = true
serde_json.workspace = true
tempfile.workspace = true

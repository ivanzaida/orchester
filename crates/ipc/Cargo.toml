[package]
name = "orchester-ipc"
description = "Desktop-runner protocol for Orchester: framing, handshake, messages, transport and the desktop-side runner client."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# A stand-in for `orchester-runner` that answers late or fails on purpose, for the runner start
# tests. Built only with the `test-runner` feature, so it never ships.
[[bin]]
name = "orchester-fake-runner"
path = "tests/support/fake_runner.rs"
required-features = ["test-runner"]

[[test]]
name = "runner_start"
required-features = ["test-runner"]

[features]
test-runner = []

[dependencies]
# Ids and preflight problems travel in messages.
orchester-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# Signals the runner process on macOS, where it has no Job Object, and gives it the search path
# of programs (`orchester_exec::search_path`).
[target.'cfg(unix)'.dependencies]
orchester-exec.workspace = true
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
win32job.workspace = true
windows-sys.workspace = true

[dev-dependencies]
# Collects the log lines of the runner start tests.
parking_lot.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

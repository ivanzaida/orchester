[package]
name = "orchester-exec"
description = "Runs programs for Orchester: the process side of core's CommandRunner, shared by the desktop and the runner."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Prints its arguments, for the tests of programs started in place of their npm launcher. Built
# only with the `test-program` feature, so it never ships.
[[bin]]
name = "orchester-print-args"
path = "tests/support/print_args.rs"
required-features = ["test-program"]

[[bin]]
name = "orchester-local-process-probe"
path = "tests/support/local_process_probe.rs"
required-features = ["test-program"]

[[test]]
name = "local_process_containment"
required-features = ["test-program"]

[[test]]
name = "launcher_program"
required-features = ["test-program"]

[features]
test-program = []

[dependencies]
orchester-core.workspace = true
sha2.workspace = true
# The content hashes of the ripgrep programs copied for agents, shared by the runner's threads.
parking_lot.workspace = true
tempfile.workspace = true
thiserror.workspace = true
serde_json.workspace = true
tracing.workspace = true

# Signals the process group of each program on macOS (see `process_group`).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Com"] }

[dev-dependencies]
tempfile.workspace = true

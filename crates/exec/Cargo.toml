[package]
name = "orchester-exec"
description = "Runs programs for Orchester: the process side of core's CommandRunner, shared by the desktop and the runner."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
orchester-core.workspace = true
sha2.workspace = true
# The content hashes of the ripgrep programs copied for agents, shared by the runner's threads.
parking_lot.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Signals the process group of each program on macOS (see `process_group`).
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
tempfile.workspace = true

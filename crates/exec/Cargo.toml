[package]
name = "orchester-exec"
description = "Runs programs for Orchester: the process side of core's CommandRunner, shared by the desktop and the runner."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Prints its arguments, for the tests of programs started in place of their npm launcher. Built
# only with the `test-program` feature, so it never ships.
[[bin]]
name = "orchester-print-args"
path = "tests/support/print_args.rs"
required-features = ["test-program"]

[[bin]]
name = "orchester-local-process-probe"
path = "tests/support/local_process_probe.rs"
required-features = ["test-program"]

# Writes down its arguments and exits with the code a test names, as git in the clone console's tests.
[[bin]]
name = "orchester-exit-with"
path = "tests/support/exit_with.rs"
required-features = ["test-program"]

[[test]]
name = "local_process_containment"
required-features = ["test-program"]

[[test]]
name = "merge_watchdog"
required-features = ["test-program"]

[[test]]
name = "launcher_program"
required-features = ["test-program"]

[[test]]
name = "clone_console"
required-features = ["test-program"]

[[test]]
name = "docker"
required-features = ["test-program"]

[features]
test-program = []

[dependencies]
orchester-core.workspace = true
sha2.workspace = true
# The content hashes of the ripgrep programs copied for agents, shared by the runner's threads.
parking_lot.workspace = true
tempfile.workspace = true
thiserror.workspace = true
serde_json.workspace = true
tracing.workspace = true

# Signals the process group of each program on macOS (see `process_group`), and reads the user's number (`user`).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
# The native UI driver's window capture through ScreenCaptureKit (`native_ui::macos::capture`), which has no bindings in
# the build: the Objective-C runtime, the blocks its completion handlers take and NSString for its errors. Already built
# for the app's notifications, so they add no crate.
block2.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true

[target.'cfg(windows)'.dependencies]
# The kill-on-close Job Object that holds a service's process tree (`process_tree`), as the runner's own jobs do.
win32job.workspace = true
# The native UI driver's UI Automation client (`native_ui`): its COM interfaces, which windows-sys does not cover, and
# the window's own rendering into memory (`PrintWindow`). Already built for the app and lurq's renderer, so it adds no
# crate; only its features grow.
windows = { workspace = true, features = ["Win32_System_Ole", "Win32_System_Variant", "Win32_Storage_Xps", "Win32_UI_Accessibility"] }
# The process listening on a service's debugging port (`listener`) comes from the TCP table (`Win32_NetworkManagement_IpHelper`).
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Com", "Win32_NetworkManagement_IpHelper"] }

[dev-dependencies]
tempfile.workspace = true

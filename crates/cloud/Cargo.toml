[package]
name = "orchester-cloud"
description = "Orchester Cloud: identity and sign-in for everyone, run by the person."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
orchester-api = { workspace = true, features = ["identity"] }
orchester-core.workspace = true
actix-web.workspace = true
argon2.workspace = true
# Readable UTC dates in the key ceremony's output.
chrono.workspace = true
deadpool-postgres.workspace = true
lettre.workspace = true
parking_lot.workspace = true
ring.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
base64.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# One PostgreSQL container for the whole run, removed at its end whatever the tests did; each test still gets its own
# database. libtest has no end-of-run hook, so the binary runs its own tests (`tests/cloud/main.rs`).
[[test]]
name = "cloud"
path = "tests/cloud/main.rs"
harness = false

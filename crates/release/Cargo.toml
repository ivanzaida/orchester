[package]
name = "orchester-release"
description = "CI's release tool for Orchester: signs the app's release files with the release key and uploads them to Orchester Cloud."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The release contract, the cloud client's upload calls and the release key's signing (`docs/cloud-api.md`, "App
# releases").
orchester-api = { workspace = true, features = ["client", "release-signing"] }
# The release token as a `SecretValue`, which the client sends only in its `Authorization` header.
orchester-core.workspace = true
thiserror.workspace = true
# The client's calls are async; one thread runs them one after another.
tokio.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

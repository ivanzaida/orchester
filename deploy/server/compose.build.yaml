# Builds the two images from this repository instead of pulling them, for development and for testing a change before
# a release. Add it to any of the stack files, from deploy/server:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
#   docker compose -f compose.private.yaml -f compose.build.yaml up -d --build
# The images are tagged with the Docker Hub names and ORCHESTER_VERSION (default `latest`); a later `docker compose
# pull` replaces them with the published ones.
services:
  server:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
  admin:
    build:
      context: ../../web
      dockerfile: Dockerfile.server

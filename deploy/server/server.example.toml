listen = "127.0.0.1:8080"
data_dir = "data"
name = "Orchester"
# The public base address; projects are at <address>/<slug>. Set it behind a proxy.
# address = "https://orchester.example.com"
# self_signed (default): the server's own certificate, generated on the first start; pem: the team's own; off: plain
# HTTP behind a proxy that holds the certificate.
tls = "self_signed"
# Extra names and addresses for the generated certificate.
# tls_names = ["orchester.internal", "10.0.4.20"]
# With tls = "pem", both PEM paths:
# tls_cert = "certificate.pem"
# tls_key = "private-key.pem"
# With tls = "off": the certificate the proxy presents, which apps check before entering a code. "auto" reads it at
# `address` (https://, checked by the system's trust store) and follows the proxy's renewals; or its SHA-256
# fingerprint ("3F:7A:...:C1"), to set again when that certificate changes.
# proxy_certificate = "auto"
trusted_proxies = []
# The server admin app on a private address: every path outside /api is forwarded to it.
admin_url = "http://127.0.0.1:3100"
# The private plain-HTTP listener only the admin app's own server side calls the API on. Never publish it.
admin_api_listen = "127.0.0.1:8741"

# Orchester Cloud with PostgreSQL and Caddy (docs/cloud-hosting.md). Every value comes from the environment or an
# `.env` file beside this one; nothing here is the person's real address, relay or key.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orchester_cloud
      POSTGRES_DB: orchester_cloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "orchester_cloud", "-d", "orchester_cloud"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      backend:
        ipv4_address: 172.30.0.4
  cloud:
    build:
      context: ../..
      dockerfile: deploy/cloud/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ORCHESTER_CLOUD_PUBLIC_URL: ${ORCHESTER_CLOUD_PUBLIC_URL:?Set ORCHESTER_CLOUD_PUBLIC_URL, e.g. https://cloud.example.com}
      # PostgreSQL on the compose network; use sslmode=require for a database across a network.
      ORCHESTER_CLOUD_DATABASE_URL: postgres://orchester_cloud:${POSTGRES_PASSWORD}@postgres:5432/orchester_cloud?sslmode=disable
      # smtps://user:pass@host:465 or smtp://user:pass@host:587?tls=required (user and password URL-encoded).
      ORCHESTER_CLOUD_SMTP_URL: ${ORCHESTER_CLOUD_SMTP_URL:?Set ORCHESTER_CLOUD_SMTP_URL}
      ORCHESTER_CLOUD_SMTP_FROM: ${ORCHESTER_CLOUD_SMTP_FROM:?Set ORCHESTER_CLOUD_SMTP_FROM}
      ORCHESTER_CLOUD_KEY_ENCRYPTION_KEY: ${ORCHESTER_CLOUD_KEY_ENCRYPTION_KEY:?Set ORCHESTER_CLOUD_KEY_ENCRYPTION_KEY}
      ORCHESTER_CLOUD_ROOT_PUBLIC_KEY: ${ORCHESTER_CLOUD_ROOT_PUBLIC_KEY:?Set ORCHESTER_CLOUD_ROOT_PUBLIC_KEY}
      # Caddy, and later the web front's server, forward the browser's address.
      ORCHESTER_CLOUD_TRUSTED_PROXIES: 172.30.0.2
    networks:
      backend:
        ipv4_address: 172.30.0.3
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      ORCHESTER_CLOUD_PUBLIC_URL: ${ORCHESTER_CLOUD_PUBLIC_URL:?Set ORCHESTER_CLOUD_PUBLIC_URL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      backend:
        ipv4_address: 172.30.0.2
    depends_on:
      - cloud
networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.0.0/24
volumes:
  postgres_data:
  caddy_data:
  caddy_config:

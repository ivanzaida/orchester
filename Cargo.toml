[workspace]
resolver = "3"
members = [
  "crates/agent",
  "crates/api",
  "crates/cloud",
  "crates/core",
  "crates/desktop",
  "crates/desktop-app",
  "crates/exec",
  "crates/index",
  "crates/ipc",
  "crates/runner",
  "crates/server",
  "crates/store",
  "crates/vault",
  "crates/workspace",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
# `unsafe` only in FFI modules that `#![allow(unsafe_code)]` with `// SAFETY:` comments (AGENTS.md).
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
large_enum_variant = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"

[workspace.dependencies]
# Without its default `http` feature: the file tools only, without the model clients' TLS stack.
orchester-agent = { path = "crates/agent", default-features = false }
orchester-api = { path = "crates/api" }
orchester-cloud = { path = "crates/cloud" }
orchester-core = { path = "crates/core" }
orchester-exec = { path = "crates/exec" }
orchester-index = { path = "crates/index" }
orchester-ipc = { path = "crates/ipc" }
orchester-server = { path = "crates/server" }
orchester-store = { path = "crates/store" }
orchester-vault = { path = "crates/vault" }
orchester-workspace = { path = "crates/workspace" }
# The macOS keychain store of the keyring crates, for `orchester-vault` (generic passwords in the
# login keychain).
apple-native-keyring-store = { version = "1", features = ["keychain"] }
# HTTP routing, JSON extraction and SSE on tokio for the shared server.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio"] }
# Orchester Cloud's HTTP server (`crates/cloud`), the person's choice for the cloud (2026-10-15); team servers stay on
# axum. Without default features: no compression, cookies, HTTP/2, websockets or macros, only routing, extractors and
# the bounded HTTP/1 server on tokio.
actix-web = { version = "4.11", default-features = false }
# Argon2id password hashing; its OS random source also supplies salts, initial passwords and tokens.
argon2 = { version = "0.5", features = ["std"] }
# A small pool of `tokio-postgres` connections with connect and wait timeouts for Orchester Cloud; a correct async
# pool is not a few lines of code.
deadpool-postgres = { version = "0.14", default-features = false, features = ["rt_tokio_1"] }
# Local wall-clock time of status bar events and the local day of the daily project budget (the OS
# time zone); std has no local time.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Compiles the Windows resource script with the application icon and links it into `orchester.exe`
# (desktop build script, Windows only). It finds the Windows SDK's resource compiler for the MSVC
# toolchain in use, which the build script cannot do in a few lines.
embed-resource = "3"
# Decodes the bundled PNG of the window icon. Already compiled with its PNG decoder for lurq's
# clipboard (arboard), so it adds no crate to the build.
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
# HTTP/1 connection builder exposes header/idle deadlines that axum::serve cannot configure; its HTTP/1 client
# connection forwards the team server's non-API paths to the server admin app on a private address.
hyper = { version = "1", default-features = false, features = ["client", "http1", "server"] }
# Tokio IO/timer and the axum-to-hyper service adapter for the bounded server transport.
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
# The common API of the keyring crates' OS keychain stores, which `orchester-vault` uses on Windows
# and macOS. Applications that pick their stores link it with the stores they need instead of
# the `keyring` facade (keyring-rs wiki, "Keyring").
keyring-core = "1"
# 0.45: the idle loop waits (`WaitUntil`) and coalesces off-thread `Signal` wakes; a multiline input scrolls in a
# scrollbar lane and moves by wrapped row; 0.44: retained `TextInputController`, `InputTokens`, CRLF paragraph endings; 0.44.1: a queued scroll wins over the
# `VirtualizedList` scroll anchor when row keys change (the chat's Jump to latest);
# 0.46: Markdown link presentation and list views (the chat's reply links and labelled-link grid), padded link
# tooltips and table cells, links kept in their bidi paragraph;
# 0.47: animation frames come when the animated value next changes (the loader's `Easing::Steps` turn), none
# while the window is minimized;
# 0.48: in-phase keyframes on one process clock (every loader steps together), a tall row's reveal ends at its top
# (the chat scrolls away from a long reply), selection from the painted layout;
# 0.43: execution-bound input origin and canceled queued-call rejection; an app's own MCP server hosts lurq's window tools (`McpConfig::hosted`, `McpHandle::service`); see
# `orchester-app`'s `mcp` module.
lurq = { version = "0.48.0", default-features = false }
# The deprecated app retains its existing create/render hook contract until it is replaced.
lurq_legacy = { package = "lurq", version = "0.42.0", default-features = false }
# Orchester Cloud's confirmation and reset emails through the person's SMTP relay, with TLS through the workspace's
# rustls and ring; SMTP with TLS and authentication is not a few lines of code.
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "ring", "rustls-platform-verifier", "smtp-transport", "tokio1-rustls"] }
# libproc process enumeration and identity on macOS; already transitive through rustix.
libc = "0.2"
parking_lot = "0.12"
# Where the text of an agent's chat message lies outside code and links, by its offsets in the source, so a task key or
# an app route path written as text becomes a link (`orchester-app`'s `ui::chat::references`). lurq's Markdown parses
# with it and keeps no offsets; already built, with these features, through lurq's `markdown`, so it adds no crate.
pulldown-cmark = { version = "0.13.4", default-features = false }
# Native folder picker for choosing a project repository; lurq already uses it for DevTools.
rfd = "0.15"
# The MCP protocol of Orchester's own MCP server: its tools (`orchester_workspace::app_mcp`) and, in
# the desktop that serves them, its streamable HTTP transport (`transport-streamable-http-server`).
# Already built, with these features, for lurq's embedded MCP server, so it adds no crate; the protocol
# and its sessions are not a few lines of code.
rmcp = { version = "3.4", default-features = false, features = ["server"] }
# The shared server's HTTP client, behind `orchester-api`'s `client` feature (`docs/architecture/server.md`,
# "Dependencies"): rustls with the operating system's trust store (`rustls-platform-verifier`) on Windows
# and macOS, no OpenSSL. A TLS-capable HTTP client is not a few lines of code; hyper is already built
# through lurq. Without default features: no system proxy lookup, no HTTP/2, and the crypto provider is
# chosen by the caller (ring, below).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# The team server's own certificate, generated on its first start (`docs/architecture/server.md`, row 39): an
# ECDSA P-256 key and a self-signed X.509 certificate through ring, the provider rustls already uses here. A
# certificate is not something to write by hand. Without `aws_lc_rs`, so no second crypto library.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rusqlite = { version = "0.40", features = ["bundled"] }
# The ring crypto provider for the client's rustls, the provider the server's own TLS already uses, and
# rustls' certificate errors, to tell an untrusted certificate from a server that cannot be reached.
# Already built through tokio-rustls.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Ed25519 signing and verifying of Orchester Cloud's identity tokens and key sets (`orchester-api`'s `identity`
# feature), AES-GCM for the cloud's stored signing keys, the team server's Ed25519 key (signed invites and the cloud
# link statement) and HMAC-SHA-256 of its codes with a constant-time check, and the OS random source for tokens and
# codes. Already built as rustls' crypto provider, so it adds no crate; there is no JWT crate: a token is a few lines
# of base64url JSON.
ring = "0.17"
# The operating system's trust store for Orchester Cloud's TLS connection to PostgreSQL, the verifier reqwest and lettre
# already use here; already in the lock file.
rustls-platform-verifier = "0.7"
# Safe `kill(2)` for signalling processes and process groups on macOS (ending the runner and each
# agent's process tree; std can only SIGKILL a single child), and `uname(2)` for the computer's
# name a shared server lists a session under (`system`). Already built for macOS through
# tempfile, so it adds no crate; Windows uses Job Objects (`win32job`) for the same job.
rustix = { version = "1", default-features = false, features = ["std", "process", "system"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# Content addresses of project blobs (`docs/architecture/storage.md`, "Blobs"); pure Rust.
sha2 = "0.11"
# A socket set up before it binds: `orchester-app`'s MCP server takes its port with SO_EXCLUSIVEADDRUSE on Windows,
# which std's one-call bind cannot set (`mcp::bind`). Already built for tokio.
socket2 = "0.6"
# Pull request syntax highlighting with Sublime grammars. Without default features and with
# `regex-fancy` it needs no C regex library (onig), so it builds the same on Windows and macOS;
# `default-syntaxes` bundles the grammars, and no themes or HTML output are compiled in.
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
tempfile = "3"
# Orchester Cloud's PostgreSQL client: async on the workspace's tokio, plain SQL with typed parameters, no ORM, macros
# or compile-time database (sqlx needs a live database or an offline cache at build time; diesel brings an ORM and a
# DSL). The default `runtime` feature connects over TCP; `with-uuid-1` maps ids.
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
# TLS from Orchester Cloud to PostgreSQL through the workspace's rustls with ring, so no OpenSSL on any platform.
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
thiserror = "2"
# The desktop also runs blocking work (database, native dialogs) off the UI thread through lurq futures.
# `signal`: the macOS runner ends its agents on SIGTERM/SIGINT; it builds on the signal handling
# `process` already compiles in.
tokio = { version = "1.53", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
# Optional server TLS with PEM loading through rustls, with no OpenSSL dependency.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Reads package manifests (`Cargo.toml`, `pyproject.toml`) for the codebase index's repository map.
# Already built for embed-resource on Windows; a TOML parser is not a few lines of code.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Syntax trees of source files for the codebase index (`orchester-index`): outlines and symbols of
# Rust, TypeScript/JavaScript, Python and Go. Each grammar is a C parser built by `cc`, like SQLite
# (rusqlite `bundled`) and zstd already are, on Windows and macOS alike.
tree-sitter = "0.27"
tree-sitter-go = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
# The host a chat shows beside a link to the web, read as a browser reads it (`https://a.com@b.org/` is b.org).
# Already built for reqwest and tower-http.
url = "2"
# `v4`: the random token that lets only the relay of one Claude Code invocation reach its permission
# prompt (`orchester_core::connection::claude_approval`); v7 ids carry a timestamp, not only random bits.
uuid = { version = "1", features = ["v4", "v7", "serde"] }
win32job = "2"
# Windows Credential Manager store of the keyring crates, for `orchester-vault`. Without the
# `search` feature: nothing searches credentials, and it would pull in regex.
windows-native-keyring-store = { version = "1.1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes"] }
# Wipes a secret value from memory when it is dropped (`orchester_core::secret::SecretValue`).
# Doing that by hand needs volatile writes, i.e. `unsafe`, which the workspace denies.
zeroize = "1"
# Compression of project blob files, as `docs/architecture/storage.md` specifies. The C library is
# built by `cc` like SQLite already is (rusqlite `bundled`), on Windows and macOS alike.
zstd = { version = "0.13", default-features = false }

# lurq's text stack at opt-level 0 makes text-heavy screens crawl in dev builds. Cargo reads
# profiles only from this workspace, so lurq cannot set this itself. The wildcard covers every
# dependency but not the workspace crates, which stay debuggable.
[profile.dev.package."*"]
opt-level = 2

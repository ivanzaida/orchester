[workspace]
resolver = "3"
members = ["crates/core", "crates/desktop", "crates/ipc", "crates/runner", "crates/store"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
# `unsafe` only in FFI modules that `#![allow(unsafe_code)]` with `// SAFETY:` comments (AGENTS.md).
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
large_enum_variant = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"

[workspace.dependencies]
orchester-core = { path = "crates/core" }
orchester-ipc = { path = "crates/ipc" }
orchester-store = { path = "crates/store" }
# Local wall-clock time of status bar events (the OS time zone); std has no local time.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
lurq = { version = "0.22.2", default-features = false }
parking_lot = "0.12"
# Native folder picker for choosing a project repository; lurq already uses it for DevTools.
rfd = "0.15"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
# The desktop also runs blocking work (database, native dialogs) off the UI thread through lurq futures.
tokio = { version = "1.53", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }
win32job = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes"] }

# lurq's text shaping at opt-level 0 makes text-heavy screens crawl in dev builds.
# These overrides must live in the consuming workspace; lurq's own do not apply here.
[profile.dev.package.cosmic-text]
opt-level = 2

[profile.dev.package.swash]
opt-level = 2

[profile.dev.package.rustybuzz]
opt-level = 2

[profile.dev.package.ttf-parser]
opt-level = 2

[profile.dev.package.fontdb]
opt-level = 2

[profile.dev.package.unicode-bidi]
opt-level = 2

[profile.dev.package.unicode-linebreak]
opt-level = 2

[profile.dev.package.unicode-script]
opt-level = 2

[profile.dev.package.skrifa]
opt-level = 2

[profile.dev.package.read-fonts]
opt-level = 2

[profile.dev.package.font-types]
opt-level = 2
